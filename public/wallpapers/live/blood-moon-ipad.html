const CFG={"cloud": [255, 45, 25], "cloudA": 0.35, "cloudH": 0.3375, "water": [[0.5975, 0.77, 0.35, 0.93]], "moon": {"x": 0.593, "y": 0.30574999999999997, "r": 0.07500000000000001, "c": [255, 50, 35], "a": 0.3}, "flick": [{"x": 0.939, "y": 0.33799999999999997, "r": 0.037500000000000006, "c": [255, 80, 40], "a": 0.25}], "pulse": [], "lights": {"n": 70, "x": [0.3, 0.95], "y": [0.5, 0.59], "cols": [[255, 120, 70]]}, "parts": {"t": "ember", "n": 40, "c": [255, 90, 40], "y": [0.7250000000000001, 0.86]}, "birds": null, "smoke": [[0.24, 0.5375000000000001]], "smokeC": [210, 170, 170], "cloudY": 0.125};
let W,H,tx=0,ty=0,mx=0,my=0;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*d;H=c.height=innerHeight*d}
addEventListener('resize',rs);rs();
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-.5,Math.min(.5,e.gamma/60));ty=Math.max(-.5,Math.min(.5,(e.beta-45)/90))}});
const R=Math.random,sm=u=>u*u*(3-2*u),smoke=[],parts=[],lights=[],birds=[];
let tex,cl,clx;
function mkTex(col){const w=512,h=128,k=document.createElement('canvas');k.width=w;k.height=h;const g=k.getContext('2d'),d=g.createImageData(w,h);
const L=[[4,2],[8,4],[16,8],[32,16]].map(([a,b])=>{const r=[];for(let i=0;i<a*b;i++)r.push(R());return{a,b,r}});
function n(l,u,v){const X=u*l.a,Y=v*l.b,x0=Math.floor(X),y0=Math.floor(Y),fx=sm(X-x0),fy=sm(Y-y0),q=(i,j)=>l.r[((j%l.b+l.b)%l.b)*l.a+((i%l.a+l.a)%l.a)];return(q(x0,y0)*(1-fx)+q(x0+1,y0)*fx)*(1-fy)+(q(x0,y0+1)*(1-fx)+q(x0+1,y0+1)*fx)*fy}
for(let j=0;j<h;j++)for(let i=0;i<w;i++){let v=0,a=.5,t=0;for(const l of L){v+=n(l,i/w,j/h)*a;t+=a;a*=.55}v/=t;const o=(j*w+i)*4,dd=Math.min(1,Math.max(0,(v-.45)*3.2)),fade=1-sm(Math.min(1,Math.max(0,(j/h-.5)/.5)));d.data.set([col[0],col[1],col[2],dd*fade*255*(CFG.cloudA||.35)],o)}
g.putImageData(d,0,0);return k}
function init(){const iw=img.width,ih=img.height;tex=mkTex(CFG.cloud);cl=document.createElement('canvas');cl.width=iw;cl.height=Math.ceil(ih*(CFG.cloudH||.45));clx=cl.getContext('2d');
const Ls=CFG.lights;if(Ls)for(let i=0;i<Ls.n;i++)lights.push({x:Ls.x[0]+R()*(Ls.x[1]-Ls.x[0]),y:Ls.y[0]+R()*(Ls.y[1]-Ls.y[0]),p:R()*9,f:1+R()*3,c:Ls.cols[i%Ls.cols.length]});
const P=CFG.parts;if(P)for(let i=0;i<P.n;i++)parts.push(np(P,true));
const B=CFG.birds;if(B)for(let i=0;i<B.n;i++)birds.push({x:R()*iw,y:(B.y[0]+R()*(B.y[1]-B.y[0]))*ih,v:.25+R()*.3,p:R()*9,s:5+R()*4})}
function np(P,init){const iw=img.width,ih=img.height;
if(P.t=='snow')return{x:R()*iw,y:init?R()*ih:-10,vy:.8+R()*1.6,vx:-.2+R()*.5,s:.8+R()*2.2,p:R()*9,a:.4+R()*.5};
if(P.t=='fly')return{x:R()*iw,y:ih*(P.y[0]+R()*(P.y[1]-P.y[0])),vx:0,vy:0,s:1+R()*1.5,p:R()*9,a:0};
return{x:R()*iw,y:ih*(P.y[0]+R()*(P.y[1]-P.y[0])),vx:(R()-.5)*.3,vy:.3+R()*.5,l:init?R()*300|0:0,m:300+R()*300,s:.8+R()*1.4}}
img.onload=()=>{init();requestAnimationFrame(f)};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function glow(px,py,r,c,a){const g=x.createRadialGradient(px,py,0,px,py,r);g.addColorStop(0,rgba(c,a));g.addColorStop(1,rgba(c,0));x.fillStyle=g;x.fillRect(px-r,py-r,r*2,r*2)}
function f(ms){
const t=ms/1000,iw=img.width,ih=img.height;
mx+=(tx-mx)*.04;my+=(ty-my)*.04;
const s=Math.max(W/iw,H/ih)*(1.07+.012*Math.sin(t*.25));
const ox=(W-iw*s)/2-mx*iw*s*.025,oy=(H-ih*s)/2-my*ih*s*.025;
x.setTransform(1,0,0,1,0,0);x.fillStyle='#000';x.fillRect(0,0,W,H);
x.setTransform(s,0,0,s,ox,oy);x.globalCompositeOperation='source-over';x.globalAlpha=1;
x.drawImage(img,0,0);
// water shimmer
for(const [y0f,y1f,x0f,x1f] of CFG.water){const y0=ih*y0f,y1=ih*y1f,sx=iw*x0f,sw=iw*(x1f-x0f);
for(let y=y0;y<y1;y+=2){const o=Math.sin(y*.09+t*1.6)*(1+(y-y0)*.03)+Math.sin(y*.21-t*2.3)*.6;x.drawImage(img,sx,y,sw,2,sx+o,y,sw,2)}}
x.globalCompositeOperation='lighter';
// drifting clouds / mist
{const CH=cl.height;clx.globalCompositeOperation='source-over';clx.clearRect(0,0,iw,CH);
[[.012,1,1,0],[.022,.8,.7,.5]].forEach(([sp,hs,al,off])=>{const o=((t*sp+off)%1)*iw;clx.globalAlpha=al;clx.drawImage(tex,o,0,iw,CH*hs);clx.drawImage(tex,o-iw,0,iw,CH*hs)});clx.globalAlpha=1;x.drawImage(cl,0,CFG.cloudY?ih*CFG.cloudY:0)}
// moon / sun pulse
{const m=CFG.moon,r=m.r*ih*(1+.05*Math.sin(t*.8));glow(m.x*iw,m.y*ih,r*2.6,m.c,m.a*(1+.35*Math.sin(t*.8)))}
// flickering lamps and candles
for(const q of CFG.flick){const a=q.a*(1+.5*Math.sin(t*13+q.x*40)*Math.sin(t*5.3+q.y*20))+R()*.05;glow(q.x*iw,q.y*ih,q.r*ih,q.c,a)}
// slow breathing glows (neon, windows, pools)
if(CFG.pulse)for(const q of CFG.pulse)glow(q.x*iw,q.y*ih,q.r*ih,q.c,q.a*(.6+.4*Math.sin(t*q.f+q.x*9)));
// blinking aircraft lights
if(CFG.blink)for(const b of CFG.blink){const a=(Math.sin(t*b.f+b.p)>.55)?1:.05;glow(b.x*iw,b.y*ih,b.r*ih,b.c,a*.9)}
// twinkling lights
for(const l of lights){const a=Math.max(0,Math.sin(t*l.f+l.p))**3*.8;x.fillStyle=rgba(l.c,a);x.beginPath();x.arc(l.x*iw,l.y*ih,1.4,0,6.3);x.fill()}
// birds
for(const b of birds){b.x+=b.v;if(b.x>iw+20)b.x=-20;const fl=Math.sin(t*6+b.p)*b.s*.5,y=b.y+Math.sin(t*.7+b.p)*6;x.strokeStyle='rgba(20,10,10,.85)';x.globalCompositeOperation='source-over';x.lineWidth=1.3;x.beginPath();x.moveTo(b.x-b.s,y+fl);x.quadraticCurveTo(b.x-b.s*.4,y-b.s*.4,b.x,y);x.quadraticCurveTo(b.x+b.s*.4,y-b.s*.4,b.x+b.s,y+fl);x.stroke();x.globalCompositeOperation='lighter'}
// particles
const P=CFG.parts;
if(P)for(let i=0;i<parts.length;i++){const e=parts[i];
if(P.t=='snow'){e.y+=e.vy;e.x+=e.vx+Math.sin(t+e.p)*.4;if(e.y>ih){parts[i]=np(P)}
x.fillStyle=`rgba(230,240,255,${e.a})`;x.beginPath();x.arc(e.x,e.y,e.s,0,6.3);x.fill()}
else if(P.t=='fly'){e.x+=Math.sin(t*.4+e.p)*.5;e.y+=Math.cos(t*.3+e.p*2)*.35;const a=Math.max(0,Math.sin(t*1.2+e.p))**2;glow(e.x,e.y,e.s*5,P.c,a*.8)}
else{e.l++;e.y-=e.vy;e.x+=e.vx+Math.sin(e.l*.05+i)*.2;if(e.l>e.m){parts[i]=np(P);continue}
x.fillStyle=rgba([P.c[0],P.c[1]+R()*40|0,P.c[2]],Math.sin(Math.PI*e.l/e.m)*.7);x.beginPath();x.arc(e.x,e.y,e.s,0,6.3);x.fill()}}
// smoke
x.globalCompositeOperation='screen';
for(const e of CFG.smoke)if(R()<.35)smoke.push({x:e[0]*iw,y:e[1]*ih,l:0,m:200+R()*120,s:3+R()*3,p:R()*6});
for(let i=smoke.length-1;i>=0;i--){const p=smoke[i];p.l++;if(p.l>p.m){smoke.splice(i,1);continue}
const k=p.l/p.m;p.y-=.5;p.x+=Math.sin(p.l*.03+p.p)*.35+.12;const r=p.s+k*26;glow(p.x,p.y,r,CFG.smokeC,Math.sin(Math.PI*k)*.1)}
requestAnimationFrame(f)}
